{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Welcome - Zambia Army</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: url("{% static 'images/army_bg.jpg' %}") no-repeat center center fixed;
            background-size: cover;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            text-align: center;
            background: rgba(0, 50, 0, 0.8);
            padding: 50px 30px;
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(0,0,0,0.7);
        }
        h1 { font-size: 2.5rem; color: #FFD700; }
        p { font-size: 1.2rem; }
    </style>
    <script>
        // Redirect to login after 3 seconds
        setTimeout(function() {
            window.location.href = "{% url 'login' %}";
        }, 3000);
    </script>
</head>
<body>
    <div class="container">
        <h1>Welcome to the Zambia Army System</h1>
        <p>Redirecting to login...</p>
    </div>
</body>
</html>
