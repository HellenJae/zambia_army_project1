{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Zambia Army Dashboard{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'dashboard/css/style.css' %}">
    <style>
        /* Body & general */
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #e6f2e6; /* Army light green background */
            color: #222;
        }

        /* Header */
        header {
            background-color: #004225; /* Dark army green */
            color: #fff;
            padding: 10px 20px;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            height: 50px;
        }

        header nav a {
            color: #fff;
            text-decoration: none;
            margin-left: 15px;
            font-weight: bold;
        }

        header nav a:hover {
            text-decoration: underline;
        }

        /* Sidebar */
        nav.sidebar {
            width: 200px;
            background-color: #005f2f; /* Darker green */
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
            padding-top: 60px; /* space for header */
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        nav.sidebar img.logo {
            width: 80px;
            margin-bottom: 20px;
        }

        nav.sidebar ul {
            list-style: none;
            padding: 0;
            width: 100%;
        }

        nav.sidebar ul li a {
            display: block;
            color: #fff;
            padding: 12px 20px;
            text-decoration: none;
            border-bottom: 1px solid #004225;
        }

        nav.sidebar ul li a:hover {
            background-color: #004225;
        }

        /* Main content */
        main {
            margin-left: 200px;
            padding: 20px;
        }

        /* Cards */
        .card {
            background-color: #fff;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.15);
        }

        /* Profile */
        .profile-table th {
            text-align: left;
            padding-right: 15px;
            color: #004225;
        }

        .profile-table td {
            padding-bottom: 10px;
        }

        .role-label {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 5px;
            color: #fff;
            font-weight: bold;
        }

        .role-admin { background-color: #e74c3c; }
        .role-officer { background-color: #2980b9; }
        .role-soldier { background-color: #27ae60; }
    </style>
</head>
<body>
    <!-- Header -->
    <header>
        <nav>
            <a href="{% url 'profile' %}">Profile</a>
            <a href="{% url 'logout' %}">Logout</a>
        </nav>
    </header>

    <!-- Sidebar -->
    <nav class="sidebar">
        <img src="{% static 'images/1.jpg' %}" alt="Zambia Army Logo" class="logo">
        <ul>
            <li><a href="{% url 'dashboard_soldier' %}">Home</a></li>
            <li><a href="{% url 'missions:mission_list' %}">Missions</a></li>
            <li><a href="{% url 'announcements:announcement_list' %}">Announcements</a></li>
            <li><a href="{% url 'messaging:inbox' %}">Messages</a></li>
        </ul>
    </nav>

    <!-- Main content -->
    <main>
        {% block content %}
        <!-- Dashboard or Profile content will go here -->
        {% endblock %}
    </main>
</body>
</html>
