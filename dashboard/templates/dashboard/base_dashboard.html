{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Zambia Army Dashboard{% endblock %}</title>

    <link rel="stylesheet" href="{% static 'dashboard/css/style.css' %}">

    <!-- FONT AWESOME (for AI icon) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        /* Body & general */
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #e6f2e6;
            color: #222;
        }

        /* Header */
        header {
            background-color: #004225;
            color: #fff;
            padding: 10px 20px;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            height: 50px;
        }

        header nav a {
            color: #fff;
            text-decoration: none;
            margin-left: 15px;
            font-weight: bold;
        }

        header nav a:hover {
            text-decoration: underline;
        }

        /* Sidebar */
        nav.sidebar {
            width: 200px;
            background-color: #005f2f;
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
            padding-top: 60px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        nav.sidebar img.logo {
            width: 80px;
            margin-bottom: 20px;
        }

        nav.sidebar ul {
            list-style: none;
            padding: 0;
            width: 100%;
        }

        nav.sidebar ul li a {
            display: block;
            color: #fff;
            padding: 12px 20px;
            text-decoration: none;
            border-bottom: 1px solid #004225;
        }

        nav.sidebar ul li a:hover {
            background-color: #004225;
        }

        /* Main content */
        main {
            margin-left: 200px;
            padding: 20px;
        }

        /* Cards */
        .card {
            background-color: #fff;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.15);
        }

        /* ROLE LABELS */
        .role-label {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 5px;
            color: #fff;
            font-weight: bold;
        }

        .role-admin { background-color: #e74c3c; }
        .role-officer { background-color: #2980b9; }
        .role-soldier { background-color: #27ae60; }

        /* ============================
           AI ASSISTANT (NEW)
        ============================ */

        .ai-assistant {
            position: fixed;
            bottom: 25px;
            right: 25px;
            width: 55px;
            height: 55px;
            border-radius: 50%;
            background: #1e7f1e;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            text-decoration: none;
            box-shadow: 0 5px 15px rgba(0,0,0,0.4);
            z-index: 9999;
            transition: 0.3s;
        }

        .ai-assistant:hover {
            transform: scale(1.1);
        }

        /* RED ALERT MODE */
        .ai-assistant.danger {
            background: darkred;
            animation: blink 1s infinite;
        }

        @keyframes blink {
            0% { opacity: 1; }
            50% { opacity: 0.4; }
            100% { opacity: 1; }
        }

        /* BADGE */
        .ai-badge {
            position: absolute;
            top: -5px;
            right: -5px;
            background: red;
            color: white;
            font-size: 11px;
            padding: 3px 6px;
            border-radius: 50%;
        }

    </style>
</head>

<body>

    <!-- Header -->
    <header>
        <nav>
            <a href="{% url 'profile' %}">Profile</a>
            <a href="{% url 'logout' %}">Logout</a>
        </nav>
    </header>

    <!-- Sidebar -->
    <nav class="sidebar">
        <img src="{% static 'images/1.jpg' %}" alt="Zambia Army Logo" class="logo">
        <ul>
            <li><a href="{% url 'dashboard_soldier' %}">Home</a></li>
            <li><a href="{% url 'missions:mission_list' %}">Missions</a></li>
            <li><a href="{% url 'announcements:announcement_list' %}">Announcements</a></li>
            <li><a href="{% url 'messaging:inbox' %}">Messages</a></li>
        </ul>
    </nav>

    <!-- Main content -->
    <main>
        {% block content %}{% endblock %}
    </main>

    <!-- ============================
         AI ASSISTANT BUTTON
    ============================ -->

    <a href="{% url 'ai_summary:dashboard' %}"
       class="ai-assistant {% if security_alert_count > 0 %}danger{% endif %}"
       title="AI Assistant">

        <i class="fa-solid fa-robot"></i>

        {% if unread_ai_notifications > 0 %}
            <span class="ai-badge">{{ unread_ai_notifications }}</span>
        {% endif %}

    </a>

</body>
</html>
