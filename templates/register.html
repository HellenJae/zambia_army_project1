{% extends 'base.html' %}
{% block content %}
<div class="card text-dark mx-auto" style="width: 450px;">
  <div class="card-body">
    <h3 class="card-title text-center">Register</h3>
    <form method="POST">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" class="btn btn-success w-100">Create Account</button>
    </form>
  </div>
</div>
{% endblock %}
