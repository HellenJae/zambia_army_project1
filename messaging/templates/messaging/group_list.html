{% extends 'dashboard/base_dashboard.html' %}
{% block content %}
<h2>Your Groups</h2>
<a href="{% url 'messaging:create_group' %}" class="btn btn-primary">Create Group</a>
<ul>
    {% for group in groups %}
    <li>
        <a href="{% url 'messaging:group_chat' group.id %}">{{ group.name }}</a>
    </li>
    {% endfor %}
</ul>
{% endblock %}
