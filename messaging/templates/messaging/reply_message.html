{% extends 'dashboard/base_dashboard.html' %}
{% block content %}
<style>
  .chat-list {
      background-color: #1b263b;
      padding: 20px;
      border-radius: 10px;
      color: white;
      max-width: 600px;
      margin: auto;
  }
  .chat-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #33415c;
      padding: 10px 0;
  }
  .chat-item a {
      color: white;
      text-decoration: none;
      font-weight: bold;
  }
  .chat-item small {
      color: #adb5bd;
  }
</style>

<div class="chat-list">
  <h2 style="text-align:center;">Messages</h2>
  {% if users %}
    {% for user in users %}
      <div class="chat-item">
        <div>
          <a href="{% url 'messaging:conversation_detail' user.id %}">
            {{ user.first_name }} {{ user.last_name }}
          </a><br>
          <small>{{ latest_messages[user.id]|truncatechars:50 }}</small>
        </div>
      </div>
    {% endfor %}
  {% else %}
    <p style="text-align:center;">No messages yet.</p>
  {% endif %}
</div>
{% endblock %}
